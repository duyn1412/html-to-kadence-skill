name: HTML-to-Kadence CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Syntax Check Scripts
        run: |
          python3 -m py_compile scripts/qa-engine.py
          python3 -m py_compile scripts/validate-blocks.py
          python3 -m py_compile scripts/run-tests.py

      - name: Run Regression Test Suite
        run: |
          python3 scripts/run-tests.py
